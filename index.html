<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Control de Relé - ESP32</title>
  <!-- Librería MQTT por WebSockets -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/paho-mqtt/1.0.1/mqttws31.min.js"></script>
  <style>
    * { box-sizing: border-box; }
    body { font-family: system-ui, sans-serif; background: #0f172a; color: #f8fafc; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
    .card { background: #1e293b; padding: 2.5rem; border-radius: 1.5rem; box-shadow: 0 10px 25px rgba(0,0,0,0.5); text-align: center; max-width: 380px; width: 90%; }
    h1 { font-size: 1.5rem; margin-bottom: 0.5rem; }
    .status { font-size: 0.9rem; margin-bottom: 2rem; color: #94a3b8; }
    .status.online { color: #22c55e; }
    
    /* Estilo del botón interactivo */
    .btn-toggle { 
      width: 100%; 
      padding: 1.2rem; 
      font-size: 1.2rem; 
      font-weight: bold; 
      border: none; 
      border-radius: 0.8rem; 
      cursor: pointer; 
      transition: all 0.2s ease;
      background-color: #ef4444; 
      color: white;
      box-shadow: 0 4px 12px rgba(239, 68, 68, 0.4);
    }
    .btn-toggle.active { 
      background-color: #22c55e; 
      box-shadow: 0 4px 12px rgba(34, 197, 94, 0.4);
    }
    .btn-toggle:active { transform: scale(0.97); }
  </style>
</head>
<body>

  <div class="card">
    <h1>Control Remoto de Relé</h1>
    <div id="status" class="status">Conectando al servidor...</div>
    
    <!-- Botón para conmuntación -->
    <button id="btnRele" class="btn-toggle" onclick="toggleRele()">RELÉ: APAGADO</button>
  </div>

  <script>
    // Tópico MQTT único (debe ser exacto en el ESP32)
    const topicControl = "stalindmolina/esp32/rele"; 
    
    const brokerHost = "broker.hivemq.com";
    const brokerPort = 8884; // Puerto seguro WSS para navegador
    const clientID = "WebClient_" + Math.random().toString(16).substr(2, 8);

    const client = new Paho.MQTT.Client(brokerHost, brokerPort, clientID);
    let releEstado = false; // Estado inicial: apagar

    client.onConnectionLost = function () {
      const el = document.getElementById("status");
      el.innerText = "Desconectado del servidor";
      el.className = "status";
    };

    client.connect({
      useSSL: true,
      onSuccess: function () {
        const el = document.getElementById("status");
        el.innerText = "● Conectado (Listo)";
        el.className = "status online";
      },
      onFailure: function () {
        document.getElementById("status").innerText = "Error de conexión";
      }
    });

    function toggleRele() {
      if (!client.isConnected()) {
        alert("Aún no hay conexión con el servidor MQTT.");
        return;
      }

      releEstado = !releEstado;
      const comando = releEstado ? "ON" : "OFF";
      const btn = document.getElementById("btnRele");

      if (releEstado) {
        btn.innerText = "RELÉ: ENCENDIDO";
        btn.classList.add("active");
      } else {
        btn.innerText = "RELÉ: APAGADO";
        btn.classList.remove("active");
      }

      // Publicar comando al Broker
      const message = new Paho.MQTT.Message(comando);
      message.destinationName = topicControl;
      client.send(message);
    }
  </script>
</body>
</html>
